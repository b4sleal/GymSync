<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymSync | Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chat-widget.css">
</head>
<nav class="navbar">
    <h1 class="logo">GymSync</h1>
    <div class="nav-links">
        <a href="landing.html" class="nav-item">Logout</a>
    </div>
</nav>
<body class="dashboard-body">

<main class="dashboard-container">
    <header class="dashboard-header">
        <h2>Welcome back, Athlete!</h2>
    </header>

    <div class="dashboard-grid">
        <section class="card streak-card">
            <h3>Current Streak</h3>
            <div class="streak-display">
                <span class="streak-number" id="streak-number">0</span>
                <span class="streak-text">Days</span>
            </div>
            <p id="streak-subtext">Keep the fire burning! 🔥</p>
        </section>

        <section class="card daily-plan-card">
            <h3>Today's Plan</h3>
            <div id="today-plan-list" class="workout-list"></div>
        </section>

        <section class="card recent-workouts-card">
            <h3>Recent Workouts</h3>
            <ul class="history-list" id="recent-workouts-list"></ul>
        </section>
    </div>
</main>

<div id="gymsync-sidenav" style="height: 100%; width: 0; position: fixed; z-index: 9999; top: 0; left: 0; background-color: #070303; overflow-x: hidden; transition: 0.3s; padding-top: 60px; border-right: 1px solid #762329; box-shadow: 4px 0 10px rgba(0,0,0,0.5);">
    <a href="javascript:void(0)" onclick="closeNav()" style="position: absolute; top: 10px; right: 20px; font-size: 36px; color: #c7a8a9; text-decoration: none;">&times;</a>
    <a href="index.html" style="padding: 15px 25px; text-decoration: none; font-size: 18px; color: #f4e2e2; display: block; transition: 0.3s; border-bottom: 1px solid rgba(199, 168, 169, 0.15);">Dashboard</a>
    <a href="planner.html" style="padding: 15px 25px; text-decoration: none; font-size: 18px; color: #f4e2e2; display: block; transition: 0.3s; border-bottom: 1px solid rgba(199, 168, 169, 0.15);">Planner</a>
    <a href="workout.html" style="padding: 15px 25px; text-decoration: none; font-size: 18px; color: #f4e2e2; display: block; transition: 0.3s; border-bottom: 1px solid rgba(199, 168, 169, 0.15);">Active Workout</a>
    <a href="chat.html" style="padding: 15px 25px; text-decoration: none; font-size: 18px; color: #f4e2e2; display: block; transition: 0.3s; border-bottom: 1px solid rgba(199, 168, 169, 0.15);">Chat</a>
    <a href="landing.html" style="padding: 15px 25px; text-decoration: none; font-size: 18px; color: #f4e2e2; display: block; transition: 0.3s; border-bottom: 1px solid rgba(199, 168, 169, 0.15);">Logout</a>

</div>

<button onclick="openNav()" style="position: fixed; left: 0; top: 50%; transform: translateY(-50%); z-index: 9998; background-color: #e03939; color: white; border: none; padding: 12px 15px; cursor: pointer; border-radius: 0 8px 8px 0; font-size: 16px; font-weight: bold; box-shadow: 2px 2px 8px rgba(0,0,0,0.4);">
    &#9776; Menu
</button>

<script>
    function openNav() {
        document.getElementById("gymsync-sidenav").style.width = "250px";
    }
    function closeNav() {
        document.getElementById("gymsync-sidenav").style.width = "0";
    }
</script>
<script src="js/chat-widget.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
